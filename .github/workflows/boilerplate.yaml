name: Boilerplate

on:
  pull_request:
    branches: ['main']

jobs:

  check:
    name: Boilerplate Check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Keep running if one leg fails.
      matrix:
        extension:
        - go
        - sh

        # Map between extension and human-readable name.
        include:
        - extension: go
          language: Go
        - extension: sh
          language: Bash

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - uses: chainguard-dev/actions/boilerplate@8fa93a69e091d35d496b4af0a32d2e79c8d1ce00 # main
        with:
          extension: ${{ matrix.extension }}
          language: ${{ matrix.language }}
